<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Post Submission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    form {
      margin-bottom: 1rem;
    }
    input, textarea, button {
      display: block;
      margin: 0.5rem 0;
      padding: 0.5rem;
      width: 300px;
    }
    .post {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-top: 1rem;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Create a New Post</h1>
  <form id="postForm">
    <input type="text" id="title" placeholder="Post Title" required />
    <textarea id="content" placeholder="Post Content" required></textarea>
    <button type="submit">Submit Post</button>
  </form>

  <h2>Submitted Post</h2>
  <div id="result"></div>

  <script src ="POSTRequests.js"></script> 
</body>
</html>
